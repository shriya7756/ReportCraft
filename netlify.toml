[build]
  command = "cd frontend/reportcraft && npm install && npm run build"
  publish = "frontend/reportcraft/out"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/research"
  to = "/.netlify/functions/research"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
