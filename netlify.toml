[build]
  base = "ReportCraft"
  command = "cd frontend/zephryn && npm install && npm run build"
  publish = "frontend/zephryn/out"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/research"
  to = "/.netlify/functions/research"
  status = 200
  force = true

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
